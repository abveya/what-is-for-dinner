<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's For Dinner</title>
  <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="bg-white border-bottom border-orange-100">
    <nav class="navbar navbar-expand-lg p-0">
      <div class="container px-4 py-3">
        <div class="navbar-brand p-0 flex-center">
          <div class="brand-icon flex-center text-size-xl text-white rounded-circle">
            <i class="fa-solid fa-utensils"></i>
          </div>
          <div>
            <h1 class="m-0 fw-bold text-size-2xl color-gray-900">What's For Dinner</h1>
            <p class="m-0 text-size-md color-gray-500">Your daily meal inspiration</p>
          </div>
        </div>
        <button class="navbar-toggler border-0 p-0" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarTogglerDemo03" aria-controls="navbarTogglerDemo03" aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end mt-3 py-3 m-md-0 p-md-0" id="navbarTogglerDemo03">
          <div class="icons-container d-flex flex-column flex-md-row align-items-start align-items-md-center">
            <button class="save-icon color-gray-600 p-0 bg-transparent border-0 mb-3 mb-md-0 flex-center">
              <i class="fa-solid fa-bookmark text-size-xl"></i>
              <span class="d-md-none ms-2">Saved Recipes</span>
            </button>
            <button class="clock-icon color-gray-600 p-0 bg-transparent border-0 mb-3 mb-md-0 flex-center">
              <i class="fa-solid fa-clock-rotate-left text-size-xl"></i>
              <span class="d-md-none ms-2">Recent</span>
            </button>
            <button class="seeting-icon color-gray-600 p-0 bg-transparent border-0 mb-3 mb-md-0 flex-center">
              <i class="fa-solid fa-gear text-size-xl"></i>
              <span class="d-md-none ms-2">Settings</span>
            </button>
            <div class="image">
              <img width="40" height="40" class="object-fit-cover rounded-circle border border-2 border-orange-300"
                src="images/avatar1.png" alt="user profile">
              <span class="d-md-none ms-2 color-gray-600">Profile</span>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main>

    <section id="recipe-display-section" class="recipe-section">
      <div class="container px-4">
        <h2 class="visually-hidden">Recipe Details</h2>
        <div class="recipe-content overflow-hidden bg-white border-1 border-orange-100">
          <div class="row h-100">
            <div class="col-lg-4 pe-lg-0 h-100 overflow-y-auto">
              <div class="image-container position-relative">
                <div id="mainImage" class="image h-100">
                </div>
                <div id="ratings" class="top-badge position-absolute bg-white py-2 px-3 rounded-5"></div>
                <div class="bottom-badge position-absolute rounded-4">
                  <div class="row justify-content-center align-items-center">
                    <div class="col-4">
                      <div class="content text-center">
                        <i class="fa-solid fa-clock mb-2 text-size-2xl color-orange-500"></i>
                        <p class="color-gray-500 text-size-sm m-0">Prep Time</p>
                        <p class="fw-bold color-gray-900 m-0 text-size-md" id="prep-time"></p>
                      </div>
                    </div>
                    <div class="col-4">
                      <div class="content text-center">
                        <i class="fa-solid fa-fire-burner mb-2 text-size-2xl color-red-500"></i>
                        <p class="color-gray-500 text-size-sm m-0">Cook Time</p>
                        <p class="fw-bold color-gray-900 m-0 text-size-md" id="cook-time"></p>
                      </div>
                    </div>
                    <div class="col-4">
                      <div class="content text-center">
                        <i class="fa-solid fa-users mb-2 text-size-2xl color-blue-500"></i>
                        <p class="color-gray-500 text-size-sm m-0">Servings</p>
                        <p class="fw-bold color-gray-900 m-0 text-size-md" id="Serving"></p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-lg-8 ps-lg-0 h-100 overflow-y-auto">
              <div class="text-container overflow-y-auto h-100">
                <div
                  class="recipe-heading d-flex align-items-md-center align-items-start justify-content-between mb-4 flex-column-reverse flex-md-row gap-4 gap-md-0">
                  <div class="left-heading">
                    <div id="top-badges" class="heading-top d-flex align-items-center">
                    </div>
                    <div id="main-heading" class="heading-bottom">
                    </div>
                  </div>
                  <div class="right-heading flex-center justify-content-end justify-content-md-center">
                    <button class="save-icon color-orange-600 bg-orange-100 p-0 border-0 mb-0 flex-center me-2">
                      <i class="fa-solid fa-bookmark"></i>
                    </button>
                    <button class="save-icon color-orange-600 bg-orange-100 p-0 border-0 mb-0 flex-center">
                      <i class="fa-solid fa-share-nodes"></i>
                    </button>
                  </div>
                </div>

                <div id="time-warning"></div>

                <div class="recipe">
                  <ul class="nav nav-pills row mb-3 p-3 mb-4 border-bottom border-gray-200" id="pills-tab"
                    role="tablist">
                    <li class="nav-item col-3" role="presentation">
                      <button
                        class="nav-link text-nowrap active w-100 pt-0 px-0 fw-semibold bg-transparent color-gray-500 pb-2 border-bottom border-2 flex-center rounded-0"
                        id="pills-ingredients-tab" data-bs-toggle="pill" data-bs-target="#pills-ingredients"
                        type="button" role="tab" aria-controls="pills-ingredients" aria-selected="true">
                        <i class="fa-solid fa-list-check me-2"></i>
                        <span class="text-truncate">Ingredients</span>
                      </button>
                    </li>
                    <li class="nav-item col-3" role="presentation">
                      <button
                        class="nav-link text-nowrap w-100 pt-0 px-0 fw-semibold bg-transparent color-gray-500 pb-2 border-bottom border-2 flex-center rounded-0"
                        id="pills-instructions-tab" data-bs-toggle="pill" data-bs-target="#pills-instructions"
                        type="button" role="tab" aria-controls="pills-instructions" aria-selected="false"> <i
                          class="fa-solid fa-book-open me-2"></i>
                        <span class="text-truncate">Instructions</span></button>
                    </li>
                    <li class="nav-item col-3" role="presentation">
                      <button
                        class="nav-link text-nowrap w-100 pt-0 px-0 fw-semibold bg-transparent color-gray-500 pb-2 border-bottom border-2 flex-center rounded-0"
                        id="pills-nutrition-tab" data-bs-toggle="pill" data-bs-target="#pills-nutrition" type="button"
                        role="tab" aria-controls="pills-nutrition" aria-selected="true"> <i
                          class="fa-solid fa-chart-pie me-2"></i>
                        <span class="text-truncate">Nutrition</span></button>
                    </li>
                    <li class="nav-item col-3" role="presentation">
                      <button
                        class="nav-link text-nowrap w-100 pt-0 px-0 fw-semibold color-gray-500 bg-transparent pb-2 border-bottom border-2 flex-center rounded-0"
                        id="pills-chef-tips-tab" data-bs-toggle="pill" data-bs-target="#pills-chef-tips" type="button"
                        role="tab" aria-controls="pills-chef-tips" aria-selected="false"> <i
                          class="fa-solid fa-lightbulb me-2"></i>
                        <span class="text-truncate">Chef's Tips</span></button>
                    </li>
                  </ul>
                  <div class="tab-content" id="pills-tabContent">
                    <div class="tab-pane fade show active" id="pills-ingredients" role="tabpanel"
                      aria-labelledby="pills-ingredients-tab" tabindex="0">
                      <div class="ingredients-container overflow-y-auto p-4 rounded-4">
                        <ul id="ingredients" class="list-unstyled"></ul>
                      </div>
                    </div>
                    <div class="tab-pane fade" id="pills-instructions" role="tabpanel"
                      aria-labelledby="pills-instructions-tab" tabindex="0">
                      <div class="instructions-container overflow-y-auto">
                        <ul id="instructions" class="list-unstyled"></ul>
                      </div>
                    </div>
                    <div class="tab-pane fade" id="pills-nutrition" role="tabpanel"
                      aria-labelledby="pills-nutrition-tab" tabindex="0">
                      <div class="nutrition-container overflow-y-auto overflow-x-hidden">
                        <div class="row gap-3 gap-md-0">
                          <div class="col-md-6 pe-2">
                            <div class="d-flex flex-column gap-3">
                              <div
                                class="nutrition-card p-3 bg-gray-50 d-flex align-items-center justify-content-between">
                                <div class="left-part flex-center">
                                  <span class="bg-orange-100 color-orange-600 rounded-3 flex-center">
                                    <i class="fa-solid fa-fire"></i>
                                  </span>
                                  <span class="fw-medium color-gray-700 text-size-sm">Calories</span>
                                </div>
                                <div class="right-part">
                                  <span id="calories" class="color-gray-900 fw-bold"></span>
                                </div>
                              </div>
                              <div
                                class=" nutrition-card p-3 bg-gray-50 d-flex align-items-center justify-content-between">
                                <div class="left-part flex-center">
                                  <span class="bg-yellow-100 color-yellow-600 rounded-3 flex-center">
                                    <i class="fa-solid fa-wheat-awn"></i>
                                  </span>
                                  <span class="fw-medium color-gray-700 text-size-sm">Carbohydrates</span>
                                </div>
                                <div class="right-part">
                                  <span id="Carbohydrate" class="color-gray-900 fw-bold"></span>
                                </div>
                              </div>
                              <div
                                class="nutrition-card p-3 bg-gray-50 d-flex align-items-center justify-content-between">
                                <div class="left-part flex-center">
                                  <span class="bg-green-100 color-green-600 rounded-3 flex-center">
                                    <i class="fa-solid fa-seedling"></i>
                                  </span>
                                  <span class="fw-medium color-gray-700 text-size-sm">Fiber</span>
                                </div>
                                <div class="right-part">
                                  <span id="Fiber" class="color-gray-900 fw-bold"></span>
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="col-md-6 ps-2">
                            <div class="d-flex flex-column gap-3">
                              <div
                                class="nutrition-card p-3 bg-gray-50 d-flex align-items-center justify-content-between">
                                <div class="left-part flex-center">
                                  <span class="bg-blue-100 color-blue-600 rounded-3 flex-center">
                                    <i class="fa-solid fa-dumbbell"></i>
                                  </span>
                                  <span class="fw-medium color-gray-700 text-size-sm">Protein</span>
                                </div>
                                <div class="right-part">
                                  <span id="Protein" class="color-gray-900 fw-bold"></span>
                                </div>
                              </div>
                              <div
                                class="nutrition-card p-3 bg-gray-50 d-flex align-items-center justify-content-between">
                                <div class="left-part flex-center">
                                  <span class="bg-red-100 color-red-600 rounded-3 flex-center">
                                    <i class="fa-solid fa-droplet"></i>
                                  </span>
                                  <span class="fw-medium color-gray-700 text-size-sm">Fat</span>
                                </div>
                                <div class="right-part">
                                  <span id="Fat" class="color-gray-900 fw-bold"></span>
                                </div>
                              </div>
                              <div
                                class="nutrition-card p-3 bg-gray-50 d-flex align-items-center justify-content-between">
                                <div class="left-part flex-center">
                                  <span class="bg-pink-100 color-pink-600 rounded-2 flex-center">
                                    <i class="fa-solid fa-cube"></i>
                                  </span>
                                  <span class="fw-medium color-gray-700 text-size-sm">Sodium</span>
                                </div>
                                <div class="right-part">
                                  <span id="Sodium" class="color-gray-900 fw-bold"></span>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="tab-pane fade" id="pills-chef-tips" role="tabpanel"
                      aria-labelledby="pills-chef-tips-tab" tabindex="0">
                      <div id="tips" class="chef-tips-container overflow-y-auto">

                      </div>
                    </div>
                  </div>
                </div>

                <div class="random-recipe border-top border-gray-200 pt-4">
                  <button onclick="tryAnotherRecipe()" id="try-another-btn"
                    class="btn px-4 text-white fw-semibold text-size-md">
                    <i class="fa-solid fa-rotate me-2"></i>Try Another Recipe
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="js/index.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/all.min.js"></script>
</body>

</html>
